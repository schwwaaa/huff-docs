.definitions{margin-top:8px;border-top:2px solid #222;padding-top:20px}.defs-title{font:700 18px/1 Arial,Helvetica,sans-serif;letter-spacing:.08em;text-transform:uppercase;margin:0 0 14px}.legend-group+.legend-group{margin-top:24px}.legend-group-title{font:700 16px/1 Arial,Helvetica,sans-serif;letter-spacing:.08em;text-transform:uppercase;margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid #999}.legend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0}.legend-col{padding:0 18px}.legend-col:first-child{padding-left:0}.legend-col:last-child{padding-right:0}.legend-col+.legend-col{border-left:1px solid #777}.entry{display:grid;grid-template-columns:36px 1fr;gap:12px;padding:10px 0;min-height:74px}.entry+.entry{border-top:1px solid #aaa}.entry-no{display:grid;place-items:center;width:34px;height:34px;background:var(--red);color:white;border-radius:50%;font-weight:800}.entry h3{font-size:15px;margin:0 0 4px}.entry p{font-size:13px;line-height:1.35;margin:0}.entry input,.entry textarea{width:100%;border:1px solid #bbb;background:#fff;padding:4px}.entry textarea{min-height:56px;resize:vertical;font-size:13px}.footer{border-top:2px solid #222;margin-top:24px;padding:12px 0 34px;display:flex;align-items:flex-start;justify-content:flex-start}.footer img{width:42px;height:42px;object-fit:cover}

/* Published references: SVG callouts are visual only. */
.arrows{pointer-events:none!important;touch-action:auto!important}.node{cursor:default!important}

/* Unified footer: HUFF at left; schwwaaa centered in the full footer width. */
.footer{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;justify-content:stretch;gap:10px}
.footer > a:first-child{grid-column:1;justify-self:start}

    display: block;

    object-fit: contain;

/* RESPONSIVE FIGURES: scale the complete screenshot + SVG together to fit the viewport.
   The fixed 1120px drawing coordinate system is preserved so callouts remain aligned. */
.figure-scroll{width:100%;max-width:100%;overflow-x:hidden;overflow-y:visible}
.figure{width:1120px;min-width:0!important;max-width:none;zoom:1}
@media(max-width:900px){.figure{padding:82px 56px 98px;min-width:0!important}}
@media(max-width:520px){.figure{padding:82px 56px 98px;min-width:0!important}}

/* Mobile reference layout: preserve original screenshot/annotation proportions,
   with an optional full-size inspection view rather than page-wide overflow. */
html,body{max-width:100%;overflow-x:clip}
.sheet{width:100%;min-width:0}
.figure-block,.definitions,.legend,.legend-col,.entry,.entry>div{min-width:0}
.entry h3,.entry p{overflow-wrap:anywhere}
.figure-scroll{width:100%;max-width:100%;overflow:hidden;overscroll-behavior-inline:contain}
.figure-scroll.is-expanded{overflow-x:auto;overflow-y:hidden;scrollbar-width:auto}
.figure-scroll.is-expanded .figure{zoom:1!important}
.figure-tools{display:none;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 12px;flex-wrap:wrap}

.figure-tools .inspect-btn:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.figure-tools .inspect-tip{font:13px/1.35 Arial,sans-serif;color:#555}
@media(max-width:900px){
 .sheet{padding:20px clamp(12px,3.5vw,26px);margin-bottom:0;box-shadow:none}
 .header{font-size:clamp(22px,5vw,36px);line-height:1.12;gap:4px;padding-bottom:14px;margin-bottom:16px}
 .figure-tools{display:flex}

 .footer >a:first-child img{width:clamp(36px,10vw,42px);height:auto}
 .footer .schwwaaa-link img{width:min(150px,38vw)}
}

 .sheet{padding:18px 12px 24px}

<main class="sheet" id="sheet"><header class="header"><span class="block" id="blockTitle">SOURCE</span><span>— HUFF Web Reference</span></header><div id="sections"></div><footer class="footer"><a href="../index.html" aria-label="Back to HUFF Web Reference Library" title="HUFF Web Reference Library"><img src="assets/huff-icon.jpg" alt="HUFF logo"></a><a class="schwwaaa-link" href="https://linktr.ee/schwwaaa" aria-label="Visit schwwaaa" target="_blank" rel="noopener noreferrer"><img src="../schwwaaa-logo.png" alt="schwwaaa"></a></footer></main>
<script>
// Public read-only SDS-001 renderer. No editing, importing, dragging, or exporting handlers.
const DEFAULT={"block":"LUMA KEY","sections":[{"key":"luma-key","image":"assets/luma-key-original.png","alt":"Unmodified LUMA KEY UI screenshot","controls":[{"id":1,"name":"Enable","description":"Turns the luma key on or off.","x":0.045,"y":0.319,"side":"top","t":0.06},{"id":2,"name":"Target","description":"Selects the layer that receives the key.","x":0.183,"y":0.319,"side":"top","t":0.2},{"id":3,"name":"Dark \u2192 Bright","description":"Selects the key threshold along the luminance range.","x":0.372,"y":0.319,"side":"top","t":0.39},{"id":4,"name":"Mix","description":"Blends keyed and unkeyed image content.","x":0.57,"y":0.319,"side":"top","t":0.62},{"id":5,"name":"Invert","description":"Reverses the key selection.","x":0.804,"y":0.319,"side":"top","t":0.83},{"id":6,"name":"Gain","description":"Adjusts the key gain.","x":0.078,"y":0.558,"side":"left","t":0.55},{"id":7,"name":"Key Source","description":"Chooses the image source driving the key.","x":0.33,"y":0.558,"side":"bottom","t":0.31},{"id":8,"name":"Stencil Capture","description":"Captures a stencil from the selected key source.","x":0.484,"y":0.558,"side":"bottom","t":0.48},{"id":9,"name":"Fade","description":"Selects how the keyed image fades or transitions.","x":0.663,"y":0.558,"side":"bottom","t":0.67},{"id":10,"name":"Cleanup","description":"Adjusts cleanup of the key selection.","x":0.07,"y":0.826,"side":"left","t":0.84},{"id":11,"name":"Density","description":"Adjusts density of the key shape.","x":0.313,"y":0.826,"side":"bottom","t":0.32}]}]};
const data=DEFAULT;
const $=id=>document.getElementById(id);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function renderSections(){
 $('sections').innerHTML=data.sections.map((sec,i)=>`<section class="figure-block">${data.block==='PANELING'?`<div class="mode-label">${i===0?'BANDS MODE':'FIELD MODE'}</div>`:''}<div class="figure-tools"><button type="button" class="inspect-btn" data-figure="${i}" aria-pressed="false" aria-controls="figure-scroll-${i}">View full-size diagram</button><span class="inspect-tip">Use full-size view to inspect numbered controls; swipe horizontally inside the diagram.</span></div><div class="figure-scroll" id="figure-scroll-${i}"><div class="figure" id="fig-${i}"><img class="capture" id="img-${i}" alt="${esc(sec.alt)}" src="${esc(sec.image)}"><svg class="arrows" id="ov-${i}" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-${i}" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3.5 L0,7 Z" fill="var(--red)"/></marker></defs><g id="cg-${i}"></g></svg></div></div><div class="definitions"><div id="legend-${i}"></div></div></section>`).join('');
 data.sections.forEach((_,i)=>{document.getElementById(`img-${i}`).addEventListener('load',()=>drawSection(i));});
}
function dims(i){let fig=document.getElementById(`fig-${i}`),im=document.getElementById(`img-${i}`);return {W:fig.clientWidth,H:fig.clientHeight,ix:im.offsetLeft,iy:im.offsetTop,iw:im.clientWidth,ih:im.clientHeight}}
function endpoint(c,d){return {x:d.ix+c.x*d.iw,y:d.iy+c.y*d.ih}}
function startpoint(c,d){let t=c.t,b=endpoint(c,d);if(c.side==='top')return {x:t*d.W,y:28};if(c.side==='bottom')return {x:t*d.W,y:d.H-30};if(c.side==='left')return {x:18,y:d.iy+clamp(t,0,1)*d.ih};return {x:d.W-18,y:d.iy+clamp(t,0,1)*d.ih}}
function layoutMarkers(controls,d){
 const pts=controls.map(c=>({c,a:startpoint(c,d)}));
 for(const side of ['top','bottom','left','right']){
  const group=pts.filter(p=>p.c.side===side).sort((a,b)=>side==='left'||side==='right'?a.a.y-b.a.y:a.a.x-b.a.x);
  if(!group.length)continue;
  let prev=-1e9;
  for(const p of group){let axis=side==='left'||side==='right'?'y':'x';let lim=axis==='x'?d.W:d.H;let v=clamp(p.a[axis],19,lim-19);v=Math.max(v,prev+39);p.a[axis]=v;prev=v;}
  const axis=side==='left'||side==='right'?'y':'x',lim=axis==='x'?d.W:d.H;
  if(prev>lim-19){let delta=prev-(lim-19);group.forEach(p=>p.a[axis]-=delta);}
 }
 return new Map(pts.map(p=>[p.c.id,p.a]));
}
function drawSection(i){let sec=data.sections[i],d=dims(i),ov=document.getElementById(`ov-${i}`),g=document.getElementById(`cg-${i}`);if(!ov||!g)return;
 ov.setAttribute('viewBox',`0 0 ${d.W} ${d.H}`);let markers=layoutMarkers(sec.controls,d);
 g.innerHTML=sec.controls.map(c=>{let a=markers.get(c.id),b=endpoint(c,d);let mx=c.side==='top'||c.side==='bottom'?a.x:(a.x+b.x)/2,my=c.side==='left'||c.side==='right'?a.y:(a.y+b.y)/2;
 let p=`${a.x},${a.y} ${mx},${my} ${b.x},${b.y}`;
 return `<g data-id="${c.id}" data-sec="${i}"><polyline points="${p}" class="leader" marker-end="url(#arrow-${i})"/><g class="node" transform="translate(${a.x},${a.y})"><circle r="17"></circle><text x="0" y="0">${c.id}</text></g></g>`}).join('');
}
function renderLegend(){data.sections.forEach((sec,sidx)=>{const wrap=document.getElementById(`legend-${sidx}`);if(!wrap)return;const size=Math.ceil(sec.controls.length/3),cols=[sec.controls.slice(0,size),sec.controls.slice(size,size*2),sec.controls.slice(size*2)];wrap.innerHTML=`<div class="legend">${cols.map(col=>`<div class="legend-col">${col.map(c=>`<article class="entry"><div class="entry-no">${c.id}</div><div><h3>${esc(c.name)}</h3><p>${esc(c.description)}</p></div></article>`).join('')}</div>`).join('')}</div>`;});}
$('blockTitle').textContent=data.block;
renderSections();renderLegend();
// Fit each diagram to its available column width. CSS zoom scales its image and SVG
// as one unit, unlike resizing the image alone (which disconnects arrow endpoints).
function fitReferenceFigures(){
  data.sections.forEach((_,i)=>{
    const fig=document.getElementById(`fig-${i}`);
    if(!fig)return;
    const viewport=fig.parentElement;
    const available=viewport.clientWidth;
    fig.style.zoom=String(viewport.classList.contains("is-expanded") ? 1 : Math.min(1,available/1120));
    drawSection(i);
  });
}
// Mobile inspection: read-only. The original annotation coordinates stay unchanged.
document.getElementById('sections').addEventListener('click', event => {
 const btn=event.target.closest('button[data-figure]');
 if(!btn)return;
 const i=Number(btn.dataset.figure);
 const viewport=document.getElementById(`figure-scroll-${i}`);
 const expanded=viewport.classList.toggle('is-expanded');
 btn.textContent=expanded?'Fit diagram to screen':'View full-size diagram';
 btn.setAttribute('aria-pressed',String(expanded));
 if(!expanded) viewport.scrollLeft=0;
 fitReferenceFigures();
});
requestAnimationFrame(fitReferenceFigures);
window.addEventListener('resize',fitReferenceFigures);
if ('ResizeObserver' in window) {
  const observer=new ResizeObserver(fitReferenceFigures);
  document.querySelectorAll('.figure-scroll').forEach(el=>observer.observe(el));
}
</script></body></html>
